# Sviluppo in locale: PostgreSQL (servizio locale o docker-compose)
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/capstone_steam}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:}
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    com.capstone.steam: DEBUG
    org.flywaydb: INFO
