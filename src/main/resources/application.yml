# Configurazione comune a tutti i profili.
# I segreti arrivano da variabili d'ambiente o dal file .env (vedi .env.example).
spring:
  application:
    name: capstone-steam-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  # Testi dell'API in messages*.properties (es di default, en, it); la lingua si ricava da Accept-Language
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    always-use-message-format: true
  # copertine caricate come file: massimo 5 MB (il 413 lo traduce GlobalExceptionHandler)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  web:
    locale: es
    locale-resolver: accept-header
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # lo schema è di proprietà di Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # le collezioni LAZY (ruoli, generi) si caricano a lotti con IN (...) invece di 1 query per riga
        default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
    # V1-V3 sono SQL portabile; V4 ha una variante per motore ({vendor} = postgresql)
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Gmail da Render a volte impiega a connettersi: 15 s e EmailService ritenta gli errori di connessione
          connectiontimeout: ${MAIL_TIMEOUT:15000}
          timeout: ${MAIL_TIMEOUT:15000}
          writetimeout: ${MAIL_TIMEOUT:15000}

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT15M}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:P7D}
  auth:
    # Pulizia giornaliera di refresh_tokens: solo famiglie intere scadute da più di grace (rispetta il rilevamento del riutilizzo)
    refresh-purge-cron: ${REFRESH_PURGE_CRON:0 30 3 * * *}
    refresh-purge-grace: ${REFRESH_PURGE_GRACE:P1D}
    # Richieste al minuto per IP a registrazione, reinvio e verifica email (poi 429)
    ip-limit:
      per-minute: ${AUTH_IP_LIMIT_PER_MINUTE:60}
    email-verification:
      # Senza verificare l'email non si può accedere. Solo i test la disattivano.
      required: ${EMAIL_VERIFICATION_REQUIRED:true}
      ttl: ${EMAIL_VERIFICATION_TTL:P1D}
      resend-per-hour: 3
  account:
    # Margine tra la richiesta di cancellazione dell'account e l'anonimizzazione; il task che la esegue gira una volta al giorno
    deletion-grace: ${ACCOUNT_DELETION_GRACE:P14D}
    deletion-cron: ${ACCOUNT_DELETION_CRON:0 15 4 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  payments:
    failure-rate: ${PAYMENT_FAILURE_RATE:0.0} # rifiuto casuale per le demo (0.0-1.0)
    declined-suffix: "0000"                  # carta che termina in 0000 = sempre rifiutata
  steam:
    # Prezzi dell'API pubblica dello store di Steam (senza chiave). Si sincronizzano all'avvio e ogni 6 h;
    # l'admin può anche lanciarla a mano. STEAM_SYNC_ENABLED=false la disattiva.
    sync-enabled: ${STEAM_SYNC_ENABLED:true}
    sync-cron: ${STEAM_SYNC_CRON:0 0 */6 * * *}
    country: es # euro
    base-url: https://store.steampowered.com
    timeout: 10s
  cloudinary:
    # cloudinary://<api_key>:<api_secret>@<cloud_name>; vuoto = non si possono caricare copertine come file
    url: ${CLOUDINARY_URL:}
    folder: arcade/covers
    timeout: 20s
  openrouter:
    # Chat di raccomandazione. Senza chiave l'assistente risponde "non disponibile" e non si fa nessuna chiamata.
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:nvidia/nemotron-3.5-super-vl:free,dots-studio/dots-3-note-preview:free,nvidia/nemotron-3-ultra-550b-a55b:free}
    base-url: https://openrouter.ai/api/v1
    timeout: 30s
    global-per-hour: 200 # tetto di messaggi all'ora tra tutti gli utenti
    cooldown: 5m # dopo un 429 di OpenRouter non si chiama il modello per questo tempo
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@capstone-steam.local}
    password: ${ADMIN_PASSWORD:}
  support:
    # casella che riceve il form di assistenza; di default lo stesso mittente delle email
    email: ${SUPPORT_EMAIL:${MAIL_FROM:${MAIL_USERNAME:}}}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@capstone-steam.local}}
    from-name: ${MAIL_FROM_NAME:ARCADE} # nome visibile del mittente e marchio delle email
    # API HTTP di Brevo: con la chiave, le email escono via HTTPS e non via SMTP (Render free blocca le porte SMTP)
    brevo:
      api-key: ${BREVO_API_KEY:}
    # dove portano i pulsanti delle email; senza FRONTEND_URL si usa la prima origine di CORS
    store-url: ${FRONTEND_URL:${CORS_ALLOWED_ORIGINS:http://localhost:5173}}
    executor:
      core-pool-size: 4
      max-pool-size: 5
      queue-capacity: 100

server:
  tomcat:
    # ingoiare il resto di un upload che supera il limite, per poter rispondere 413 senza chiudere la connessione
    max-swallow-size: 10MB
  port: ${SERVER_PORT:${PORT:8080}} # PORT lo fissa la piattaforma di deploy (Render)

management:
  health:
    mail:
      enabled: false # un errore SMTP non deve segnare l'API come non disponibile (l'email è asincrona e opzionale)
  endpoints:
    web:
      exposure:
        include: health,info
