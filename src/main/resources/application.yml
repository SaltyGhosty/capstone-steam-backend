# Configuración común a todos los perfiles.
# Los secretos llegan por variables de entorno o desde el archivo .env (ver .env.example).
spring:
  application:
    name: capstone-steam-backend
  config:
    import: optional:file:.env[.properties]
  profiles:
    default: dev
  # Textos de la API en messages*.properties (es por defecto, en, it); el idioma sale de Accept-Language
  messages:
    basename: messages
    encoding: UTF-8
    fallback-to-system-locale: false
    always-use-message-format: true
  # portadas subidas como archivo: máximo 5 MB (el 413 lo traduce GlobalExceptionHandler)
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  web:
    locale: es
    locale-resolver: accept-header
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema es propiedad de Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # colecciones LAZY (roles, géneros) se cargan en lotes con IN (...) en vez de 1 query por fila
        default_batch_fetch_size: 50
  data:
    web:
      pageable:
        max-page-size: 100
  flyway:
    enabled: true
    # V1-V3 son SQL portable; V4 tiene una variante por motor ({vendor} = postgresql | h2)
    locations: classpath:db/migration/common,classpath:db/migration/{vendor}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          # Gmail desde Render a veces tarda en conectar: 15 s y EmailService reintenta los fallos de conexión
          connectiontimeout: ${MAIL_TIMEOUT:15000}
          timeout: ${MAIL_TIMEOUT:15000}
          writetimeout: ${MAIL_TIMEOUT:15000}

app:
  jwt:
    secret: ${JWT_SECRET:}
    expiration: ${JWT_EXPIRATION:PT15M}
    refresh-expiration: ${JWT_REFRESH_EXPIRATION:P7D}
  auth:
    # Purga diaria de refresh_tokens: solo familias enteras caducadas hace más de grace (respeta la detección de reutilización)
    refresh-purge-cron: ${REFRESH_PURGE_CRON:0 30 3 * * *}
    refresh-purge-grace: ${REFRESH_PURGE_GRACE:P1D}
    # Peticiones por minuto y IP al registro, reenvío y verificación de email (429 después)
    ip-limit:
      per-minute: ${AUTH_IP_LIMIT_PER_MINUTE:20}
    email-verification:
      # Sin verificar el email no se puede iniciar sesión. Solo los tests lo desactivan.
      required: ${EMAIL_VERIFICATION_REQUIRED:true}
      ttl: ${EMAIL_VERIFICATION_TTL:P1D}
      resend-per-hour: 3
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  payments:
    failure-rate: ${PAYMENT_FAILURE_RATE:0.0} # rechazo aleatorio para demos (0.0-1.0)
    declined-suffix: "0000"                  # tarjeta terminada en 0000 = rechazada siempre
  steam:
    # Precios de la API pública de la tienda de Steam (sin clave). Se sincronizan al arrancar y cada 6 h;
    # el admin también puede lanzarlo a mano. STEAM_SYNC_ENABLED=false lo desactiva.
    sync-enabled: ${STEAM_SYNC_ENABLED:true}
    sync-cron: ${STEAM_SYNC_CRON:0 0 */6 * * *}
    country: es # euros
    base-url: https://store.steampowered.com
    timeout: 10s
  cloudinary:
    # cloudinary://<api_key>:<api_secret>@<cloud_name>; vacío = no se pueden subir portadas como archivo
    url: ${CLOUDINARY_URL:}
    folder: arcade/covers
    timeout: 20s
  openrouter:
    # Chat recomendador. Sin clave el asistente responde "no disponible" y no se hace ninguna llamada.
    api-key: ${OPENROUTER_API_KEY:}
    model: ${OPENROUTER_MODEL:minimax/minimax-m3.1-flash:free,google/gemma-4-31b-it:free}
    base-url: https://openrouter.ai/api/v1
    timeout: 30s
    global-per-hour: 200 # tope de mensajes por hora entre todos los usuarios
    cooldown: 5m # tras un 429 de OpenRouter no se llama al modelo durante este tiempo
  admin:
    username: ${ADMIN_USERNAME:admin}
    email: ${ADMIN_EMAIL:admin@capstone-steam.local}
    password: ${ADMIN_PASSWORD:}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@capstone-steam.local}}
    from-name: ${MAIL_FROM_NAME:ARCADE} # nombre visible del remitente y marca de los correos
    # adónde llevan los botones de los correos; sin FRONTEND_URL se usa el primer origen de CORS
    store-url: ${FRONTEND_URL:${CORS_ALLOWED_ORIGINS:http://localhost:5173}}
    executor:
      core-pool-size: 4
      max-pool-size: 5
      queue-capacity: 100

server:
  tomcat:
    # tragarse el resto de una subida que pasa del límite, para poder responder 413 y no cortar la conexión
    max-swallow-size: 10MB
  port: ${SERVER_PORT:${PORT:8080}} # PORT lo fija la plataforma de despliegue (Render)

management:
  health:
    mail:
      enabled: false # un fallo de SMTP no debe marcar la API como caída (el correo es asíncrono y opcional)
  endpoints:
    web:
      exposure:
        include: health,info
