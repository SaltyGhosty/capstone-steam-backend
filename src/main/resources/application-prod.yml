# Producción: todo llega por variables de entorno, sin valores por defecto.
# La BD se puede dar como DB_URL (JDBC completa) o por partes (DB_HOST, DB_PORT, DB_NAME),
# que es como la expone Render.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

# Render pone un proxy delante: Tomcat toma la IP real de X-Forwarded-For (la más a la derecha que no sea un proxy
# interno), así el límite por IP de las rutas de cuenta no ve siempre la IP del proxy ni se puede falsificar
server:
  forward-headers-strategy: native

logging:
  level:
    root: INFO
