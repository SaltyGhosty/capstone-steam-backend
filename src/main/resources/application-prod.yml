# Produzione: tutto arriva da variabili d'ambiente, senza valori di default.
# Il DB si può indicare come DB_URL (JDBC completo) o per parti (DB_HOST, DB_PORT, DB_NAME),
# che è come lo espone Render.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

# Render mette un proxy davanti: Tomcat prende l'IP reale da X-Forwarded-For (il più a destra che non sia un proxy
# interno), così il limite per IP delle rotte account non vede sempre l'IP del proxy né si può falsificare
server:
  forward-headers-strategy: native

logging:
  level:
    root: INFO
