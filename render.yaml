# Blueprint de Render: API (Docker) + frontend (static site) + PostgreSQL, en Frankfurt.
# En Render: New > Blueprint > elige este repositorio. Los valores con sync: false se piden al crearlo.
# El despliegue actual (2026-10-19) se creó a mano con estos mismos valores; ver README → Despliegue.
services:
  - type: web
    name: capstone-steam-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        fromDatabase: { name: capstone-steam-db, property: host }
      - key: DB_PORT
        fromDatabase: { name: capstone-steam-db, property: port }
      - key: DB_NAME
        fromDatabase: { name: capstone-steam-db, property: database }
      - key: DB_USER
        fromDatabase: { name: capstone-steam-db, property: user }
      - key: DB_PASSWORD
        fromDatabase: { name: capstone-steam-db, property: password }
      - key: JWT_SECRET
        generateValue: true # 256 bits aleatorios en Base64
      - key: CORS_ALLOWED_ORIGINS
        value: https://capstone-steam-web.onrender.com # URL del frontend (el static site de abajo)
      - key: ADMIN_PASSWORD
        sync: false # no uses la de desarrollo: el README la publica
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_APP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false # vacío o igual a MAIL_USERNAME
      - key: CLOUDINARY_URL
        sync: false # cloudinary://<api_key>:<api_secret>@<cloud_name>; vacío = sin subida de portadas
      - key: OPENROUTER_API_KEY
        sync: false # clave de OpenRouter; vacía = el chat recomendador dice "no disponible"
      - key: OPENROUTER_MODEL
        value: minimax/minimax-m3.1-flash:free,google/gemma-4-31b-it:free
      - key: ACCOUNT_DELETION_GRACE
        value: P14D # pausa antes de anonimizar una cuenta dada de baja
      - key: ACCOUNT_DELETION_CRON
        value: 0 15 4 * * * # tarea diaria que anonimiza las bajas vencidas (también al arrancar)

  - type: web
    name: capstone-steam-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite # React Router: cualquier ruta sirve la app (el postbuild deja también un 404.html)
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://capstone-steam-api.onrender.com

databases:
  - name: capstone-steam-db
    plan: free # caduca a los 30 días
    region: frankfurt
    databaseName: capstone_steam
