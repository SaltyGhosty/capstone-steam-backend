# Alternativa a PostgreSQL local. Usa el puerto 5433 para no chocar con un servicio local en el 5432.
# Uso: docker compose up -d   y en .env:  DB_URL=jdbc:postgresql://localhost:5433/capstone_steam
services:
  postgres:
    image: postgres:17-alpine
    container_name: capstone-steam-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: capstone_steam
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
